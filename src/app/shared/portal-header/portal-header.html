<header class="portal-header">
  <div class="header-inner">
    <a class="brand" routerLink="/apps" aria-label="ETIC Aplicaciones, ir al catálogo">
      <img src="/img_etic_menu.png" alt="" class="mark"><span>ETIC <small>Aplicaciones</small></span>
    </a>
    <div class="account">
      <span class="user-name" [title]="auth.user()?.name ?? ''"><i class="pi pi-user" aria-hidden="true"></i>{{ auth.user()?.name }}</span>
      <p-button [icon]="theme.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'" [text]="true" [rounded]="true"
        severity="secondary" (onClick)="theme.toggle()"
        [ariaLabel]="theme.mode() === 'dark' ? 'Usar tema claro' : 'Usar tema oscuro'" />
      <p-button icon="pi pi-sign-out" [text]="true" [rounded]="true" severity="secondary" (onClick)="logout()"
        ariaLabel="Cerrar sesión" />
    </div>
  </div>
  @if(error()){<p class="header-error" role="alert">{{ error() }}</p>}
</header>
